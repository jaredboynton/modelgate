[package]
name = "unified-model-proxy-v2"
version = "0.1.12"
edition = "2021"
autobins = false

[features]
default = []
mcp = []

[[bin]]
name = "unified-model-proxy-v2"
path = "src/main.rs"

[[bin]]
name = "fast-context-mcp"
path = "src/bin/fast_context_mcp/main.rs"
required-features = ["mcp"]

[dependencies]
aes = "0.8.4"
aes-gcm-siv = "0.11"
anyhow = "1"
async-trait = "0.1"
ctr = "0.9.2"
axum = { version = "0.7", features = ["macros", "ws"] }
base64 = "0.22"
bytes = "1"
dirs = "5"
fs2 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
h2 = "0.4.14"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
rustls = { version = "0.23.40", features = ["ring"] }
rustls-native-certs = "0.8.3"
tokio-rustls = "0.26.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
warpsock = { git = "https://github.com/jaredboynton/warpsock", branch = "main" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

# Build-acceleration profile knobs.
#
# Test/dev wall-clock on macOS is dominated by link + debuginfo emission
# across 50+ test binaries. Stripping debuginfo from tests and from every
# transitive dep crate cuts link time and target/ size dramatically without
# touching product behavior. Line tables are kept on the workspace crate so
# panics still resolve to source lines.
#
# Pair with one of two env profiles (see scripts/dev-test.sh):
#   - inner loop:        CARGO_INCREMENTAL=1, no RUSTC_WRAPPER
#   - cold / branch hop: CARGO_INCREMENTAL=0, RUSTC_WRAPPER=sccache
# sccache is bypassed on incremental compiles, so mixing them silently
# disables the cache.

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
split-debuginfo = "unpacked"
incremental = true

[profile.test.package."*"]
debug = 0
