openapi: 3.1.0
info:
  title: Codex OAuth Upstream Endpoint Surface
  version: 0.1.0
  summary: Upstream endpoints observed with Codex OAuth bearer tokens.
  description: |
    This document describes upstream ChatGPT, Codex, and public OpenAI
    endpoints that Guidewire has evidence for with Codex OAuth bearer tokens.
    It intentionally excludes local Guidewire loopback routes.

    Operations use Guidewire vendor extensions to distinguish proven support
    and auth-accepted body validation failures where applicable.
  x-guidewire-scope: upstream-codex-oauth-only
  x-guidewire-primary-evidence:
    - docs/CODEX-TO-RESPONSES-ADAPTER.md
    - docs/CHATGPT-TO-RESPONSES-ADAPTER.md
    - docs/gpt-web-evidence/atlas_voice_re_20260515/INDEX.md
    - fixtures/codex/models-upstream.json
servers:
  - url: https://chatgpt.com
    description: ChatGPT and Codex HTTPS backend surfaces.
  - url: https://api.openai.com
    description: Public OpenAI HTTPS surfaces probed with Codex OAuth.
  - url: wss://chatgpt.com
    description: ChatGPT and Codex WebSocket surfaces.
  - url: wss://api.openai.com
    description: Public OpenAI WebSocket realtime surface.
security:
  - codexOAuthBearer: []
tags:
  - name: Codex catalog
    description: Codex model discovery and capability catalog.
  - name: Codex responses
    description: Codex backend Responses-style generation and compaction.
  - name: Codex usage
    description: Codex backend usage, quota, configuration, and task endpoints.
  - name: Codex connectors
    description: Codex connector directory and workspace connector management.
  - name: Codex plugins
    description: Codex plugin catalog and curated plugin export.
  - name: Codex tasks
    description: Codex cloud task listing and retrieval.
  - name: Codex files
    description: Internal Codex file upload and transcription surfaces.
  - name: Public realtime
    description: Public OpenAI realtime and audio endpoints tested with Codex OAuth.
  - name: Public embeddings
    description: Public OpenAI embeddings endpoints tested with Codex OAuth.
  - name: ChatGPT product
    description: ChatGPT product backend surfaces accepted with Codex OAuth.
paths:
  /backend-api/models:
    get:
      operationId: getChatGptWebModelCatalog
      tags:
        - ChatGPT product
      summary: Fetch the ChatGPT web product model catalog.
      description: |
        Returns the ChatGPT web product model picker catalog. These slugs use
        hyphen form (e.g. `gpt-5-5-pro`) and are accepted by
        `/backend-api/f/conversation`. The response includes `title`,
        `secondary_title`, and a `models` array with `slug`, `max_tokens`,
        `title`, `description`, `tags`, and `capabilities`.

        **Notable absence:** `gpt-5-4-nano` does not appear in this catalog,
        confirming the observed remap behavior documented in
        `docs/gpt-5-4-nano-probe.md`.
      servers:
        - url: https://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - $ref: '#/components/parameters/ChatGPTAccountId'
      responses:
        '200':
          description: ChatGPT web model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptWebModelCatalog'
              examples:
                observed:
                  summary: Observed model IDs from May 2026 validation.
                  value:
                    title: ChatGPT
                    secondary_title: ""
                    models:
                      - slug: gpt-5-5-pro
                        max_tokens: 410000
                        title: GPT-5.5 Pro
                        description: Best for complex tasks
                        tags:
                          - history_off_approved
                        capabilities: {}
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-evidence:
        - docs/gpt-5-4-nano-probe.md
        - fixtures/codex/models-web-chatgpt.json

  /backend-api/codex/models:
    get:
      operationId: getCodexModelCatalog
      tags:
        - Codex catalog
      summary: Fetch the Codex model catalog.
      description: |
        Returns a Codex-specific model catalog, not the public OpenAI
        `/v1/models` shape. The `client_version` query parameter is required;
        missing it returned `400 invalid_request_error` in live validation.

        **Response wrapping:** Live probes show the response is wrapped as
        `{"detail": {"models": [...]}}` rather than a top-level `{"models": [...]}`.
        Parsers must unwrap the `detail` envelope.
      servers:
        - url: https://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - $ref: '#/components/parameters/ChatGPTAccountId'
        - name: client_version
          in: query
          required: true
          description: Codex app or CLI client version used for entitlement-gated catalog selection.
          schema:
            type: string
          examples:
            appVersion:
              value: 26.506.31421
            bundledCli:
              value: 0.130.0-alpha.5
      responses:
        '200':
          description: Codex model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexModelCatalogWrapped'
              examples:
                observed:
                  summary: Observed model IDs from May 2026 validation.
                  value:
                    detail:
                      models:
                        - slug: gpt-5.5
                          display_name: GPT-5.5
                          input_modalities:
                            - text
                            - image
                          default_reasoning_level: xhigh
                          supported_reasoning_levels:
                            - effort: low
                              description: Fast responses with lighter reasoning
                            - effort: medium
                              description: Balances speed and reasoning depth for everyday tasks
                            - effort: high
                              description: Greater reasoning depth for complex problems
                            - effort: xhigh
                              description: Extra high reasoning depth for complex problems
                          support_verbosity: true
                          default_verbosity: low
                          service_tiers:
                            - id: priority
                              name: Fast
                              description: 1.5x speed, increased usage
                          supports_image_detail_original: true
                          truncation_policy:
                            mode: tokens
                            limit: 10000
                          supported_in_api: true
                          visibility: list
        '400':
          description: Missing or rejected `client_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#model-discovery-and-selection
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence
        - sidecar/src/codex/modelCatalogService.ts
        - fixtures/codex/models-upstream.json
        - fixtures/codex/models-codex-catalog.json
      x-guidewire-notes:
        - Hide `codex-auto-review` from public clients unless an internal caller explicitly includes hidden models.
        - Apply each model capability from this catalog rather than guessing from model names.
        - The response is wrapped in a `detail` envelope; unwrap before indexing.

  /backend-api/codex/responses:
    post:
      operationId: createCodexResponse
      tags:
        - Codex responses
      summary: Create a Codex backend response over HTTPS/SSE.
      description: |
        Creates a Codex backend response using a flat Responses-shaped request.
        Live validation required `instructions`, list-shaped `input`, and
        `stream: true`. The backend returned `store: false` and streamed
        `response.*` events, including encrypted reasoning output when requested.
      servers:
        - url: https://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - $ref: '#/components/parameters/ChatGPTAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodexResponseCreateRequest'
            examples:
              text:
                value:
                  model: gpt-5.5
                  instructions: You are a helpful assistant.
                  input:
                    - role: user
                      content:
                        - type: input_text
                          text: Reply with OK.
                  stream: true
                  store: false
                  reasoning:
                    effort: medium
                    summary: auto
                  include:
                    - reasoning.encrypted_content
              compactionTrigger:
                value:
                  model: gpt-5.5
                  instructions: You are a helpful assistant.
                  input:
                    - type: compaction_trigger
                  stream: true
                  store: false
      responses:
        '200':
          description: SSE stream containing Responses-style events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                textDelta:
                  value: |
                    data: {"type":"response.output_text.delta","delta":"OK"}

                    data: {"type":"response.completed","response":{"store":false}}
            application/json:
              schema:
                $ref: '#/components/schemas/CodexResponseObject'
        '400':
          description: Invalid request shape, including unsupported compaction item aliases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence
        - sidecar/src/codex/responsesClient.ts
        - sidecar/src/codex/websocketClient.ts
      x-guidewire-notes:
        - The live compaction request item is `compaction_trigger`, not `context_compaction`.
        - Public retrieve semantics for `store: false` responses must be adapter-owned.

    get:
      operationId: connectCodexResponsesWebSocket
      tags:
        - Codex responses
      summary: Connect to Codex Responses WebSocket.
      description: |
        WebSocket connection to the Codex responses backend. Clients send a
        `response.create` envelope after the WebSocket opens and receive JSON
        `response.*` event frames.
      servers:
        - url: wss://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - $ref: '#/components/parameters/ChatGPTAccountId'
        - name: OpenAI-Beta
          in: header
          required: true
          description: Required Codex Responses WebSocket beta header.
          schema:
            type: string
            const: responses_websockets=2026-02-06
        - name: originator
          in: header
          required: true
          schema:
            type: string
            example: guidewire
        - name: x-client-request-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: session_id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket upgrade accepted.
        '401':
          description: Missing or invalid Codex OAuth bearer.
        '429':
          description: Rate limited by Codex backend.
      x-guidewire-protocol: websocket
      x-guidewire-websocket-client-message:
        $ref: '#/components/schemas/CodexResponsesWebSocketCreateMessage'
      x-guidewire-websocket-server-message:
        $ref: '#/components/schemas/ResponseStreamEvent'
      x-guidewire-disposition: implemented
      x-guidewire-auth-scope-result: accepted
      x-guidewire-evidence:
        - sidecar/src/codex/responsesClient.ts
        - sidecar/src/codex/websocketClient.ts

  /backend-api/codex/responses/compact:
    post:
      operationId: compactCodexResponseContext
      tags:
        - Codex responses
      summary: Compact Codex response context.
      description: |
        Forwards a compaction request to the Codex backend. Live validation
        returned preserved user messages plus a `compaction_summary` item with
        encrypted content. Adapter storage should canonicalize that item to
        `compaction` before replay.
      servers:
        - url: https://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - $ref: '#/components/parameters/ChatGPTAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodexCompactRequest'
      responses:
        '200':
          description: Compacted message list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexCompactResponse'
        '400':
          description: Invalid compaction request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence

  /v1/realtime:
    get:
      operationId: connectPublicRealtimeWebSocketWithCodexOAuth
      tags:
        - Public realtime
      summary: Connect to public Realtime WebSocket with Codex OAuth.
      description: |
        Text-only public Realtime WebSocket route accepted Codex OAuth for
        `gpt-realtime-2` in live validation. GA session fields are required;
        old beta fields and invalid top-level models were rejected.
      servers:
        - url: wss://api.openai.com
      security:
        - codexOAuthBearer: []
      parameters:
        - name: model
          in: query
          required: true
          schema:
            type: string
            enum:
              - gpt-realtime-2
              - gpt-realtime
          description: Realtime session model. Do not use STT or TTS model IDs as top-level session models.
      responses:
        '101':
          description: WebSocket upgrade accepted.
        '400':
          description: Invalid session model or request field shape.
      x-guidewire-protocol: websocket
      x-guidewire-disposition: auth-accepted
      x-guidewire-auth-scope-result: accepted
      x-guidewire-diarization: not-supported
      x-guidewire-diarization-notes: |
        The GA realtime session schema exposes no per-speaker attribution. User
        audio items are tagged `role: "user"` and segmented by server VAD only;
        no `speaker_id`, `participant`, `diarization`, or acoustic-fingerprint
        keys appear on any `oai-events` event. Verified end-to-end on the
        sibling WebRTC route `/v1/realtime/calls`; this WebSocket route shares
        the same session schema family.

        2026-05-19 WebSocket probe: `session.update` with
        `session.audio.input.transcription.model=gpt-4o-transcribe-diarize`
        was rejected with `invalid_parameter` and the misleading message
        `"Your organization does not have access to this transcription
        model."`. The same model on REST `/v1/audio/transcriptions` returned
        `200` for the same Codex OAuth bearer, proving the gate is the
        Realtime route, not the bearer or the org. The dormant
        `conversation.item.input_audio_transcription.segment.speaker` field
        on openai-python Realtime types confirms backend plumbing exists
        but is not enabled. Diarization belongs on REST today.
      x-guidewire-rejected-transcription-models:
        - model: gpt-4o-transcribe-diarize
          status: 400
          code: invalid_parameter
          message: Your organization does not have access to this transcription model.
        - model: gpt-4o-mini-transcribe-diarize
          status: 400
          code: invalid_value
          message: Model not in Realtime transcription allowlist.
      x-guidewire-realtime-transcription-allowlist:
        - whisper-1
        - gpt-realtime-whisper
        - gpt-4o-transcribe
        - gpt-4o-mini-transcribe
        - gpt-4o-mini-transcribe-2025-03-20
        - gpt-4o-mini-transcribe-2025-12-15
      x-guidewire-websocket-client-message:
        oneOf:
          - $ref: '#/components/schemas/RealtimeSessionUpdateEvent'
          - $ref: '#/components/schemas/RealtimeConversationItemCreateEvent'
          - $ref: '#/components/schemas/RealtimeResponseCreateEvent'
      x-guidewire-websocket-server-message:
        $ref: '#/components/schemas/RealtimeServerEvent'
      x-guidewire-rejected-variants:
        - model: gpt-realtime-whisper
          reason: STT model must be nested under realtime transcription config.
        - model: gpt-4o-mini-tts
          reason: TTS model is not a realtime session model.
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence

  /v1/realtime/calls:
    post:
      operationId: createRealtimeWebRtcCallWithCodexOAuth
      tags:
        - Public realtime
      summary: Create a public Realtime WebRTC call.
      description: |
        Proven working with Codex OAuth for
        `gpt-4o-realtime-preview-2024-12-17` using `Content-Type:
        application/sdp` and a raw SDP offer. A minimal invalid SDP body for
        `gpt-realtime` returned `400 invalid_offer`, proving auth reached body
        validation.
      servers:
        - url: https://api.openai.com
      security:
        - codexOAuthBearer: []
      parameters:
        - name: model
          in: query
          required: true
          schema:
            type: string
            examples:
              - gpt-4o-realtime-preview-2024-12-17
              - gpt-realtime
      requestBody:
        required: true
        content:
          application/sdp:
            schema:
              type: string
              description: Raw SDP offer body.
      responses:
        '201':
          description: SDP answer.
          content:
            application/sdp:
              schema:
                type: string
        '400':
          description: Invalid SDP offer after auth acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-diarization: not-supported
      x-guidewire-diarization-notes: |
        Codex OAuth on `gpt-realtime-2`: `session.update` is accepted with
        GA `session.audio.input.transcription`/`turn_detection` nesting.
        All user-audio items arrive tagged `role: "user"` with no
        `speaker_id` / `participant` / `diarization` keys, including when
        two acoustically distinct voices share a single VAD turn. Reproduce
        with `cargo run -p guidewire-openai --example realtime_console`.

        2026-05-19 probe of `gpt-4o-transcribe-diarize` on this route's
        sibling WebSocket session is rejected with `invalid_parameter`
        and the misleading message `"Your organization does not have access
        to this transcription model."`. The block is route-shaped, not
        org-shaped: the same bearer succeeds on REST
        `/v1/audio/transcriptions` for the same model. Use REST for
        diarization with this Codex OAuth bearer until OpenAI ships
        diarize on Realtime.
      x-guidewire-session-update-shape:
        type: session.update
        session:
          type: realtime
          audio:
            input:
              transcription:
                model: gpt-4o-mini-transcribe
              turn_detection:
                type: server_vad
      x-guidewire-evidence:
        - docs/CHATGPT-TO-RESPONSES-ADAPTER.md#webrtc-via-apiopenaicomv1realtimecalls--proven-working-may-2026
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence
        - crates/guidewire-openai/examples/realtime_console.rs
        - crates/guidewire-openai/src/realtime_console.rs

  /v1/realtime/client_secrets:
    post:
      operationId: createRealtimeTranscriptionSessionWithCodexOAuth
      tags:
        - Public realtime
      summary: Create a GA public realtime transcription client secret.
      description: |
        Codex OAuth is accepted for GA realtime transcription session creation
        through the client-secrets route with `session.type: transcription`.
        A fresh 2026-05-19 probe showed the older
        `/v1/realtime/transcription_sessions` beta route now returns
        `beta_api_shape_disabled`, so adapters must use this GA route.
      servers:
        - url: https://api.openai.com
      security:
        - codexOAuthBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTranscriptionSessionRequest'
            examples:
              observed:
                value:
                  session:
                    type: transcription
                    audio:
                      input:
                        format:
                          type: audio/pcm
                          rate: 24000
                        transcription:
                          model: gpt-realtime-whisper
                        turn_detection: null
      responses:
        '200':
          description: Realtime transcription session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTranscriptionSession'
      x-guidewire-disposition: auth-accepted
      x-guidewire-auth-scope-result: accepted
      x-guidewire-diarization: not-supported
      x-guidewire-diarization-notes: |
        2026-05-19 probe: minting a `client_secret` with
        `session.audio.input.transcription.model=gpt-4o-transcribe-diarize`
        returned `400 invalid_parameter` with the misleading message
        `"Your organization does not have access to this transcription
        model."`. The legacy beta `/v1/realtime/transcription_sessions`
        route returned the same error and an additional
        `beta_api_shape_disabled` close on the WebSocket. REST
        `/v1/audio/transcriptions` accepts the same model with the same
        bearer; treat diarization as a REST-only surface in this adapter.
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#live-validation-evidence

  /v1/audio/transcriptions:
    post:
      operationId: createAudioTranscriptionWithCodexOAuth
      tags:
        - Public realtime
      summary: Create a public audio transcription.
      description: |
        Codex OAuth is positively proven on this REST route, including the
        diarization-capable `gpt-4o-transcribe-diarize` model. Live probe on
        2026-05-19 with a valid 24kHz mono WAV returned `200` for
        `gpt-4o-transcribe`, `gpt-4o-transcribe-diarize`,
        `gpt-4o-transcribe-diarize` with `response_format=diarized_json`
        (returning `{text, segments[]}`), and the same model with
        `stream=true` (SSE `transcript.text.delta`,
        `transcript.text.segment`, `transcript.text.done`,
        `[DONE]`). The `transcript.text.segment` SSE event carries
        `speaker`, `start`, `end`, `text`, `id`, and is only emitted when
        `response_format=diarized_json` and `stream=true`.

        This REST surface is the only proven path for diarization with this
        Codex OAuth bearer; see the negative receipts on `/v1/realtime`,
        `/v1/realtime/calls`, and `/v1/realtime/client_secrets` below.
      servers:
        - url: https://api.openai.com
      security:
        - codexOAuthBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - model
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  description: |
                    Transcription model. Diarization requires
                    `gpt-4o-transcribe-diarize` and `response_format=diarized_json`.
                  enum:
                    - whisper-1
                    - gpt-4o-transcribe
                    - gpt-4o-mini-transcribe
                    - gpt-4o-transcribe-diarize
                  example: gpt-4o-transcribe-diarize
                response_format:
                  type: string
                  enum:
                    - json
                    - text
                    - srt
                    - verbose_json
                    - vtt
                    - diarized_json
                  description: |
                    Use `diarized_json` with `gpt-4o-transcribe-diarize` to receive
                    speaker-tagged segments. Required for `stream=true` segment
                    speaker events.
                stream:
                  type: boolean
                  description: |
                    SSE streaming. With `gpt-4o-transcribe-diarize` +
                    `response_format=diarized_json`, server emits
                    `transcript.text.delta`, `transcript.text.segment`
                    (carrying `speaker`), and `transcript.text.done` events
                    terminated by `data: [DONE]`.
                known_speaker_names:
                  type: array
                  description: |
                    Optional stable speaker labels paired index-wise with
                    `known_speaker_references`. Returned `speaker` values fall
                    back to `A`, `B`, `C` when unset.
                  items:
                    type: string
                known_speaker_references:
                  type: array
                  description: |
                    Optional base64-encoded reference audio clips used as
                    voiceprints for `known_speaker_names` matching.
                  items:
                    type: string
                    format: byte
      responses:
        '200':
          description: Successful transcription response. Shape depends on `response_format`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscription'
              examples:
                diarizedJson:
                  summary: 2026-05-19 probe shape (sine WAV; segments empty when no speech).
                  value:
                    text: ""
                    segments: []
                    usage:
                      type: tokens
                      total_tokens: 71
                      input_tokens: 10
                      output_tokens: 61
            text/event-stream:
              schema:
                type: string
              examples:
                streamingDiarize:
                  summary: 2026-05-19 SSE on `gpt-4o-transcribe-diarize`.
                  value: |
                    data: {"type":"transcript.text.done","text":"","usage":{"type":"tokens","total_tokens":83}}

                    data: [DONE]
        '400':
          description: Body validation rejected the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-diarization: rest-only
      x-guidewire-diarization-notes: |
        REST `/v1/audio/transcriptions` is the only proven diarization surface
        with this Codex OAuth bearer. `gpt-4o-transcribe-diarize` is rejected
        by every Realtime route with `invalid_parameter` and the misleading
        message `"Your organization does not have access to this transcription
        model."`; cross-account research (openai-python SDK enums advertise
        the model on Realtime, the server still rejects) shows the gate is
        global, not org-specific. Realtime allowlist enumerated by the server
        on 2026-05-19 was `whisper-1`, `gpt-realtime-whisper`,
        `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`,
        `gpt-4o-mini-transcribe-2025-03-20`, and
