    CodexResponsesWebSocketCreateMessage:
      allOf:
        - $ref: '#/components/schemas/CodexResponseCreateRequest'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: response.create
      x-guidewire-notes:
        - Codex Responses WebSocket is stricter than HTTP for top-level request fields.
        - Live probes on 2026-05-21 accepted `client_metadata`, `prompt_cache_key`, `reasoning`, `include`, and `tool_choice`, but rejected top-level `metadata`, `originator`, `chatMode`, `temperature`, and arbitrary unknown keys with `400 invalid_request_error`.
        - Keep session/thread metadata in `client_metadata` or headers, not top-level `metadata` or `originator`.

