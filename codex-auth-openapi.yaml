    post:
      operationId: createChatGptVoicePeerWithCodexOAuth
      tags:
        - ChatGPT product
      summary: Create a ChatGPT web voice peer connection.
      description: |
        Proven with Codex OAuth through the ChatGPT web voice route. Production
        evidence uses browser-compatible transport and multipart text fields
        `sdp` and `session`; do not move production POSTs off the proven
        browser/Specter transport without fresh validation.
      servers:
        - url: https://chatgpt.com
      security:
        - codexOAuthBearer: []
      parameters:
        - name: dcid
          in: query
          required: true
          schema:
            type: integer
            example: 0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sdp
                - session
              properties:
                sdp:
                  type: string
                  description: Atlas-shaped SDP offer.
                session:
                  type: string
                  description: JSON-encoded ChatGPT web voice session payload.
      responses:
        '201':
          description: SDP answer returned by ChatGPT voice peer endpoint.
          content:
            application/sdp:
              schema:
                type: string
            text/plain:
              schema:
                type: string
      x-guidewire-disposition: proven
      x-guidewire-auth-scope-result: accepted
      x-guidewire-diarization: not-supported
      x-guidewire-diarization-notes: |
        VP shares the GA realtime session schema family with `/v1/realtime` and
        `/v1/realtime/calls`. None of those surfaces emit per-speaker attribution
        on `oai-events`. VP additionally cannot be observed end-to-end from
        non-Atlas Codex-OAuth clients because ICE admission is gated at the
        HTTP-admission layer per `docs/gpt-web-evidence/atlas_voice_re_20260515/network.md`
        sections 3 and 7. The sibling `/v1/realtime/calls` route is therefore the
        practical proof surface for diarization claims, and its result transfers.
      x-guidewire-evidence:
        - docs/CHATGPT-TO-RESPONSES-ADAPTER.md#webrtc-via-apiopenaicomv1realtimecalls--proven-working-may-2026
        - docs/gpt-web-evidence/atlas_voice_re_20260515/INDEX.md
        - crates/guidewire-openai/examples/realtime_console.rs
