components:
  securitySchemes:
    codexOAuthBearer:
      type: http
      scheme: bearer
      bearerFormat: Codex OAuth access token
      description: Codex OAuth bearer token from the Codex/ChatGPT auth flow.
  parameters:
    ChatGPTAccountId:
      name: ChatGPT-Account-Id
      in: header
      required: false
      description: Optional ChatGPT account selector header used by Codex/ChatGPT backend surfaces.
      schema:
        type: string
  schemas:
    OpenAIStyleErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type:
                - string
                - 'null'
            code:
              type:
                - string
                - 'null'
          additionalProperties: true
      additionalProperties: true

    ChatGptWebModelCatalog:
      type: object
      description: ChatGPT web product model picker catalog.
      properties:
        title:
          type: string
        secondary_title:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/ChatGptWebCatalogModel'
      required:
        - title
        - models

    ChatGptWebCatalogModel:
      type: object
      description: ChatGPT web product model catalog row.
      properties:
        slug:
          type: string
          description: Web-facing model slug using hyphen form (e.g. gpt-5-5-pro).
        max_tokens:
          type: integer
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        capabilities:
          type: object
          additionalProperties: true
        product_features:
          type: object
          additionalProperties: true
      required:
        - slug
        - title

    CodexModelCatalogWrapped:
      type: object
      description: Codex model catalog response wrapper observed in live probes.
      properties:
        detail:
          $ref: '#/components/schemas/CodexModelCatalog'
      required:
        - detail

    CodexModelCatalog:
      type: object
      properties:
        models:
          type: array
          items:
