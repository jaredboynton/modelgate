  /v1/embeddings:
    post:
      operationId: createEmbeddingWithCodexOAuth
      tags:
        - Public embeddings
      summary: Create embeddings with Codex OAuth on selected embedding models.
      description: |
        Public OpenAI embeddings are not a Codex backend Responses surface and
        are not discoverable through the Codex model catalog. A 2026-05-19
        live probe showed the Codex OAuth bearer is accepted by
        `POST https://api.openai.com/v1/embeddings` for
        `text-embedding-3-small` and `text-embedding-3-large`.

        Negative probes from the same pass: `text-embedding-ada-002` returned
        `401` missing `model.request`; `gpt-5.4-mini` returned `403` because
        embeddings are not allowed from that model; and `GET /v1/models`
        returned `403` missing `api.model.read`.
      servers:
        - url: https://api.openai.com
      security:
        - codexOAuthBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingCreateRequest'
            examples:
              small:
                value:
                  model: text-embedding-3-small
                  input: hello
              large:
                value:
                  model: text-embedding-3-large
                  input: hello
      responses:
        '200':
          description: Embedding vector response for accepted embedding models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingCreateResponse'
              examples:
                smallObserved:
                  summary: "`text-embedding-3-small` probe result shape."
                  value:
                    object: list
                    data:
                      - object: embedding
                        index: 0
                        embedding:
                          - 0.0
                    model: text-embedding-3-small
                    usage:
                      prompt_tokens: 1
                      total_tokens: 1
                largeObserved:
                  summary: "`text-embedding-3-large` probe result shape."
                  value:
                    object: list
                    data:
                      - object: embedding
                        index: 0
                        embedding:
                          - 0.0
                    model: text-embedding-3-large
                    usage:
                      prompt_tokens: 1
                      total_tokens: 1
        '401':
          description: "Missing scope for some embedding models, observed on `text-embedding-ada-002`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
        '403':
          description: Model not allowed for embeddings or missing model-list scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIStyleErrorEnvelope'
      x-guidewire-disposition: partially-proven
      x-guidewire-auth-scope-result: accepted-for-selected-models
      x-guidewire-observed-models:
        - model: text-embedding-3-small
          status: 200
          dimensions: 1536
        - model: text-embedding-3-large
          status: 200
          dimensions: 3072
      x-guidewire-rejected-variants:
        - model: text-embedding-ada-002
          status: 401
          reason: "Missing `model.request` scope."
        - model: gpt-5.4-mini
          status: 403
          reason: Embeddings are not allowed from this model.
        - route: GET /v1/models
          status: 403
          reason: "Missing `api.model.read` scope; embedding models cannot be discovered through the public model list with this bearer."
      x-guidewire-notes:
        - Keep embeddings on explicit public `/v1/embeddings` routing.
        - Do not validate embedding model IDs against the Codex model catalog.
        - Do not pass embedding model IDs to `/backend-api/codex/responses`.
      x-guidewire-evidence:
        - docs/CODEX-TO-RESPONSES-ADAPTER.md#public-embeddings-auth-probes

