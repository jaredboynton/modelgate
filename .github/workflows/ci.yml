name: CI scaffold

on:
  workflow_dispatch:
    inputs:
      run_rust_checks:
        description: "Run Rust checks on the GitHub runner"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-portability-gate:
    name: dependency portability gate
    runs-on: ubuntu-latest
    outputs:
      rust_checks_enabled: ${{ steps.decision.outputs.rust_checks_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain current CI status
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          echo "rust_checks_enabled=${{ inputs.run_rust_checks }}" >> "$GITHUB_OUTPUT"
          cat <<'MSG'
          This workflow is manual, but the Warpsock dependency is portable.
          The local-path detector below remains a guard against regressions.
          No live provider credentials are used by these jobs.
          MSG

      - name: Detect clone-blocking local path dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'path *= *"/Users/|path *= *"/home/|path *= *"/[^"]+"' Cargo.toml Cargo.lock 2>/dev/null; then
            cat <<'MSG'
          Found an absolute local path in Cargo metadata.
          Current blocker: a tracked local Cargo path would break GitHub-hosted CI.
          This gate is report-only for scaffolding, but must stay clean before required remote CI.
          MSG
          else
            echo "No absolute local Cargo paths found by this lightweight gate."
          fi

  rust-checks:
    name: intended Rust checks
    runs-on: ubuntu-latest
    needs: dependency-portability-gate
    if: ${{ needs.dependency-portability-gate.outputs.rust_checks_enabled == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --check

      # Run nextest first so the workspace .rlib exists in target/, then run
      # clippy with --no-deps + --tests so it only lints the workspace crate
      # against the metadata cargo already typechecked. This avoids a second
      # full link pass and keeps clippy at ~lint-only cost.
      - name: Test (nextest)
        run: cargo nextest run --profile ci

      - name: Clippy (workspace-only, post-test)
        run: cargo clippy --tests --no-deps --all-features -- -D warnings

      - name: Build
        run: cargo build

  rust-checks-pending:
    name: rust checks pending portability
    runs-on: ubuntu-latest
    needs: dependency-portability-gate
    if: ${{ needs.dependency-portability-gate.outputs.rust_checks_enabled != 'true' }}
    steps:
      - name: Pending by design
        run: |
          cat <<'MSG'
          Rust fmt/check/test/clippy/build jobs are defined but skipped by the workflow input.
          Re-run with run_rust_checks=true when remote validation is needed.
          MSG
